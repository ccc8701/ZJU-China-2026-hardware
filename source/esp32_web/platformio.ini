[platformio]
default_envs = lolin32_lite_tank_web

[env:lolin32_lite_tank_web]
platform = espressif32@6.12.0
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
    espressif/toolchain-xtensa-esp32@8.4.0+2021r2-patch5
    platformio/tool-esptoolpy@2.40900.250804
framework = arduino
board = lolin32_lite
board_build.f_cpu = 240000000L
board_build.f_flash = 40000000L
board_build.flash_mode = dio
board_build.partitions = default.csv
board_upload.flash_size = 4MB
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wall
    -Wextra
    -std=gnu++11

[env:esp32_s3_n8r2_tank_web]
extends = env:lolin32_lite_tank_web
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
    espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5
    platformio/tool-esptoolpy@2.40900.250804
board = esp32-s3-devkitc-1
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi
board_build.psram_type = qspi
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
build_flags =
    ${env:lolin32_lite_tank_web.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
